[build]
  command = "npm run build"
  publish = ".next"

# Secret scanning stays ON: a build must fail rather than publish a key.
#
# Omitted paths are files that legitimately mention variable *names* (package
# manifests, the env template) and can never hold a value.
#
# Omitted keys are the NEXT_PUBLIC_* values. Those are public by design — Next
# inlines them into the HTML of every page — so the scanner always finds them
# in the build output and would fail every deploy for no security benefit.
# Anything without the NEXT_PUBLIC_ prefix is still scanned.
[build.environment]
  NODE_VERSION = "22"
  SECRETS_SCAN_OMIT_PATHS = "package.json, package-lock.json, .env.example, .netlify/, .next/"
  SECRETS_SCAN_OMIT_KEYS = "NEXT_PUBLIC_SITE_URL, NEXT_PUBLIC_SUPABASE_URL, NEXT_PUBLIC_FIREBASE_API_KEY, NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN, NEXT_PUBLIC_FIREBASE_PROJECT_ID, NEXT_PUBLIC_FIREBASE_APP_ID, SUPABASE_STORAGE_BUCKET"

[[redirects]]
  from = "/api/*"
  to = "/api/:splat"
  status = 200

[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
